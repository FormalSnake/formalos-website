<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Geist; src: url("http://localhost:4324/fonts/geist-latin-wght-normal.woff2") format("woff2-variations"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url("http://localhost:4324/fonts/geist-mono-latin-wght-normal.woff2") format("woff2-variations"); font-weight: 100 900; }
  body { margin: 0; background: #161616; }
  #og { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #161616; color: #ececec; font-family: Geist; }
  #og .name { position: absolute; left: 64px; top: 56px; font-size: 30px; font-weight: 500; letter-spacing: -0.01em; }
  #og h1 { position: absolute; left: 64px; top: 150px; margin: 0; width: 640px; font-size: 76px; line-height: 1.02; font-weight: 500; letter-spacing: -0.035em; }
  #og .stage { position: absolute; left: 600px; top: 330px; right: 0; bottom: 0; background: #4a9eda;
    clip-path: polygon(0 0, 190px 0, 230px 40px, 100% 40px, 100% 100%, 0 100%); }
  #og pre { position: absolute; left: 640px; top: 400px; margin: 0; padding: 22px 24px 60px; width: 600px; background: #121212;
    border-radius: 10px 0 0 0; font: 17px/1.6 "Geist Mono"; color: #ececec; }
  .c { color: #a3a3a3; } .s { color: #8cbde6; }
  #icon { width: 512px; height: 512px; background: #161616; position: relative; overflow: hidden; }
  #icon .stage { position: absolute; left: 96px; top: 150px; right: 0; bottom: 0; background: #4a9eda;
    clip-path: polygon(0 0, 150px 0, 212px 62px, 100% 62px, 100% 100%, 0 100%); }
</style>
</head>
<body>
  <div id="og">
    <div class="name">FormalOS</div>
    <h1>One system, any distro under it</h1>
    <div class="stage"></div>
<pre><span class="c"># Written by the FormalSpec installer.</span>
hosts = [
    host(
        name = <span class="s">"g815"</span>,
        modules = [desktop(<span class="s">"fedora"</span>, desktop = <span class="s">"gnome"</span>)],</pre>
  </div>
</body>
</html>
